# ==============================================================================
# Balananda Vaidik Sewa — Render Blueprint Specification
# Deploys:
# 1. Managed PostgreSQL Database
# 2. Node.js Express Backend Service
# ==============================================================================

databases:
  - name: balananda-db
    databaseName: balananda
    user: balananda_admin
    plan: free # or standard for high availability
    region: singapore # Closest region to Nepal for ultra-low latency

services:
  - type: web
    name: balananda-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: balananda-db
          property: connectionString
      - key: SUPERADMIN_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
