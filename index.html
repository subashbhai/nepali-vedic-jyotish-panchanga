    <!-- Google AdSense: website मा मात्र लोड हुन्छ, Electron desktop app मा लोड हुँदैन -->
    <script>
      (function() {
        // Electron desktop app मा AdSense नलोड गर्ने
        if (typeof window !== 'undefined' && window.electronAPI && window.electronAPI.isDesktop) {
          return;
        }
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1955279955732879';
        s.setAttribute('data-ad-client', 'ca-pub-1955279955732879');
        document.head.appendChild(s);
        window.__adsenseLoaded = true;
      })();
    </script>
  </head>
  <body>
    <script>
      // Automatically unregister any stale service workers in preview/development environment
      if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname.includes('run.app') || location.port === '3000')) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
    </script>
