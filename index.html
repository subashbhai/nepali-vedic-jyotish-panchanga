<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>बालानन्द ज्योतिष, वास्तु तथा कर्मकाण्ड सेवा</title>
    <meta name="description" content="नेपालकै सबैभन्दा भरपर्दो वैदिक सेवा - वैदिक ज्योतिष, पञ्चाङ्ग, कुण्डली, फलादेश, गोचर, वास्तु तथा कर्मकाण्ड सेवा प्रणाली।" />
    <meta property="og:title" content="बालानन्द ज्योतिष, वास्तु तथा कर्मकाण्ड सेवा" />
    <meta property="og:description" content="नेपालकै सबैभन्दा भरपर्दो वैदिक सेवा - वैदिक ज्योतिष, पञ्चाङ्ग, कुण्डली, फलादेश, गोचर, वास्तु तथा कर्मकाण्ड सेवा प्रणाली।" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Google AdSense: website मा मात्र लोड हुन्छ, Electron desktop app मा लोड हुँदैन -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        // Electron desktop app मा AdSense नलोड गर्ने
        if (window.electronAPI && window.electronAPI.isDesktop) {
          return;
        }

        try {
          var clientId = 'ca-pub-1955279955732879';
          var raw = localStorage.getItem('balananda_advertisement_config_v2');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.adsense) {
              if (parsed.adsense.enabled === false) {
                return; // AdSense disabled by SuperAdmin
              }
              if (parsed.adsense.clientId && parsed.adsense.clientId.trim()) {
                clientId = parsed.adsense.clientId.trim();
              }
            }
          }

          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + encodeURIComponent(clientId);
          s.setAttribute('data-ad-client', clientId);
          s.setAttribute('data-adsense-injected', 'true');
          document.head.appendChild(s);
          window.__adsenseLoaded = true;
        } catch (e) {
          // silently handle
        }
      })();
    </script>
  </head>
  <body>
    <script>
      // Automatically unregister any stale service workers in preview/development environment
      if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname.includes('run.app') || location.port === '3000')) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
