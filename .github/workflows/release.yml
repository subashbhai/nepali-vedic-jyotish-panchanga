name: Build and Release Multi-Platform Desktop and Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Direct Release (Windows .exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows App (.exe)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish Windows App to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.3' }}
          name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.3' }}
          body: "नेपाली वैदिक ज्योतिष तथा पञ्चाङ्ग आधिकारिक रिलिज - Windows, Android, macOS (संस्करण १.०.३)"
          files: |
            dist_electron/*.exe
            dist_electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build & Release (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" nepali-vedic-jyotish-panchanga.apk
            ls -la nepali-vedic-jyotish-panchanga.apk
          fi

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.3' }}
          name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.3' }}
          body: "नेपाली वैदिक ज्योतिष तथा पञ्चाङ्ग आधिकारिक रिलिज - Windows, Android, macOS (संस्करण १.०.३)"
          files: |
            nepali-vedic-jyotish-panchanga.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build & Release (macOS App)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build macOS App
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish macOS App to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.3' }}
          name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.3' }}
          body: "नेपाली वैदिक ज्योतिष तथा पञ्चाङ्ग आधिकारिक रिलिज - Windows, Android, macOS (संस्करण १.०.३)"
          files: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
