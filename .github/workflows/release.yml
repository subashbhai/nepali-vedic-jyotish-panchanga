name: Build and Release Multi-Platform Desktop and Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Direct Release (Windows .exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows App (.exe)
        run: npx electron-builder --win --publish never

      - name: Publish Windows App to GitHub Release
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.3"
          fi
          echo "Target Release Tag: $TAG_NAME"
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "नेपाली वैदिक ज्योतिष तथा पञ्चाङ्ग आधिकारिक रिलिज $TAG_NAME" || true
          for f in dist_electron/*.exe dist_electron/latest.yml; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build & Release (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK to Release
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" nepali-vedic-jyotish-panchanga.apk
            TAG_NAME="${{ github.ref_name }}"
            if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
              TAG_NAME="v1.0.3"
            fi
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "नेपाली वैदिक ज्योतिष तथा पञ्चाङ्ग आधिकारिक रिलिज $TAG_NAME" || true
            gh release upload "$TAG_NAME" nepali-vedic-jyotish-panchanga.apk --clobber || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build & Release (macOS App)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build macOS App
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish macOS App to GitHub Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.3"
          fi
          gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "नेपाली वैदिक ज्योतिष तथा पञ्चाङ्ग आधिकारिक रिलिज $TAG_NAME" || true
          for f in dist_electron/*.dmg dist_electron/*.zip; do
            if [ -f "$f" ]; then
              gh release upload "$TAG_NAME" "$f" --clobber || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
