<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>बालानन्द ज्योतिष तथा पञ्चाङ्ग</title>
    <script>
      // GitHub Pages SPA redirect fix
      // If requested on GitHub Pages without the repository path, or on deep route 404,
      // redirect immediately to the full repo path while preserving search params & hash
      var l = window.location;
      var repo = 'nepali-vedic-jyotish-panchanga';
      var host = l.host;
      var pathname = l.pathname || '/';

      if (host.indexOf('github.io') !== -1) {
        if (pathname.indexOf(repo) === -1) {
          // Prepend repo path
          var cleanPath = pathname.replace(/^\/+/, '');
          var targetPath = '/' + repo + '/' + cleanPath;
          l.replace(l.protocol + '//' + host + targetPath + l.search + l.hash);
        } else {
          // Inside repo, redirect to repo root with SPA path
          l.replace(l.protocol + '//' + host + '/' + repo + '/' + l.search + l.hash);
        }
      } else {
        l.replace(l.protocol + '//' + host + '/' + l.search + l.hash);
      }
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #555;">
      <h2>पुनर्निर्देशन हुँदैछ (Redirecting)...</h2>
      <p>बालानन्द वैदिक ज्योतिष तथा पञ्चाङ्ग लोड हुँदैछ...</p>
    </div>
  </body>
</html>
